<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wickershammail.com</title>
<meta name="description" content="A private email domain, in use since 2005.">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-14 -2 68 70'%3E%3Cstyle%3E.w%7Bstroke:%23111%7D.m%7Bstroke:%239a9a9a%7D@media (prefers-color-scheme:dark)%7B.w%7Bstroke:%23eee%7D.m%7Bstroke:%23777%7D%7D%3C/style%3E%3CclipPath id='c'%3E%3Crect x='-10' y='0' width='60' height='66'/%3E%3C/clipPath%3E%3Cg clip-path='url(%23c)' fill='none' stroke-width='6.5'%3E%3Cpath class='w' d='M-1.5-3.6L10 24 20 6 30 24 41.5-3.6'/%3E%3Cpath class='m' d='M-1.5 69.6L10 42 20 60 30 42 41.5 69.6'/%3E%3C/g%3E%3C/svg%3E">
<style>
  :root {
    --bg: #ffffff;
    --ink: #111111;
    --muted: #666666;
    --frame: #e2e2e2;
    --reflect: #b5b5b5;
    --sans: system-ui, -apple-system, "Segoe UI Variable Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0a0a0a;
      --ink: #ededed;
      --muted: #9a9a9a;
      --frame: #2a2a2a;
      --reflect: #555555;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 400 1rem/1.5 var(--sans);
    -webkit-font-smoothing: antialiased;
    padding: clamp(10px, 2vw, 24px);
  }
  .frame {
    position: relative;
    min-height: calc(100vh - 2 * clamp(10px, 2vw, 24px));
    min-height: calc(100svh - 2 * clamp(10px, 2vw, 24px));
    border: 1px solid var(--frame);
    display: grid;
    place-items: center;
    padding: 5.5rem 1.25rem;
  }
  .corner {
    position: absolute;
    margin: 0;
    font-size: 0.6875rem;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .tl { top: 1.4rem; left: 1.5rem; }
  .tr { top: 1.4rem; right: 1.5rem; text-align: right; }
  .bl { bottom: 1.4rem; left: 1.5rem; }
  .br { bottom: 1.4rem; right: 1.5rem; text-align: right; }
  .center { text-align: center; }
  .mark {
    display: block;
    margin: 0 auto;
    width: clamp(76px, 9vw, 120px);
    height: auto;
    overflow: visible;
  }
  .mark .w { stroke: var(--ink); }
  .mark .m { stroke: var(--reflect); }
  h1 {
    margin: clamp(2rem, 5vh, 2.75rem) 0 0.5rem;
    font-size: clamp(1.25rem, 2.2vw, 1.625rem);
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .center p { margin: 0; color: var(--muted); }
  @media (max-width: 560px) {
    .tl, .tr { top: 1rem; } .tl, .bl { left: 1rem; } .tr, .br { right: 1rem; }
    .bl, .br { bottom: 1rem; }
    .bl { bottom: 2.3rem; }
    .br { left: 1rem; right: auto; text-align: left; }
  }
</style>
</head>
<body>
<div class="frame">
  <p class="corner tl">Private email</p>
  <p class="corner tr">Since 2005</p>
  <main class="center">
    <svg class="mark" viewBox="-4 0 48 66" role="img" aria-label="Monogram: a W above its reflection, an M">
      <defs><clipPath id="clip"><rect x="-10" y="0" width="60" height="66"/></clipPath></defs>
      <g clip-path="url(#clip)" fill="none" stroke-width="4.5" stroke-linejoin="miter">
        <path class="w" d="M-1.5 -3.6 L10 24 L20 6 L30 24 L41.5 -3.6"/>
        <path class="m" d="M-1.5 69.6 L10 42 L20 60 L30 42 L41.5 69.6"/>
      </g>
    </svg>
    <h1>wickershammail.com</h1>
    <p>A private email domain.</p>
  </main>
  <p class="corner bl">This page is the whole site</p>
  <p class="corner br">No cookies &middot; No tracking</p>
</div>
</body>
</html>
